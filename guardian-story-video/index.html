<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dunfaire Guardian story video</title>
<style>
/* Dunfaire dark palette + the official logo cyan #00CBF8. English only. */
@font-face { font-family: "Inter Tight"; src: url("../src/assets/inter-tight-latin.woff2") format("woff2"); font-weight: 100 900; }
:root { --bg:#0B1416; --panel:#122023; --line:#2A3D41; --text:#EAF2F3; --dim:#8FA3A7; --cyan:#00CBF8; --green:#55D69E; --red:#F26B73; --violet:#8B5CF6; --amber:#F2B34C; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Inter Tight", Inter, Arial, sans-serif; color: var(--text); background: var(--bg); }
#glow1, #glow2 { position: absolute; border-radius: 50%; filter: blur(140px); }
#glow1 { width: 900px; height: 900px; background: rgba(0,203,248,.13); }
#glow2 { width: 800px; height: 800px; background: rgba(85,214,158,.09); }
#gridbg { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 80px 80px; }
.sc { position: absolute; inset: 0; }
.abs { position: absolute; }
.lab { position: absolute; font-family: Consolas, monospace; font-size: 24px; letter-spacing: .22em; color: var(--cyan); }
.h1 { position: absolute; font-size: 78px; font-weight: 700; line-height: 1.04; letter-spacing: -.02em; }
.sub { position: absolute; font-size: 32px; line-height: 1.3; color: var(--dim); }
.card { position: absolute; background: var(--panel); border: 2px solid var(--line); border-radius: 22px; }
.chip { position: absolute; height: 52px; line-height: 48px; padding: 0 24px; border-radius: 26px; border: 2px solid var(--line); font-size: 26px; font-weight: 600; color: var(--text); white-space: nowrap; }
.cam { position: absolute; width: 96px; height: 60px; border-radius: 8px; background: #0e191c; border: 2px solid var(--line); }
.cam i { position: absolute; left: 8px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.clock { position: absolute; font-family: Consolas, monospace; font-weight: 700; letter-spacing: .04em; }
.row { position: absolute; height: 96px; border-radius: 16px; border: 2px solid var(--line); background: var(--panel); }
.row b { position: absolute; left: 150px; top: 14px; font-size: 32px; font-weight: 600; white-space: nowrap; }
.row span { position: absolute; left: 150px; top: 56px; font-size: 22px; color: var(--dim); white-space: nowrap; }
.row em { position: absolute; right: 24px; top: 26px; font-style: normal; font-size: 22px; font-weight: 700; padding: 6px 18px; border-radius: 20px; }
.row u { position: absolute; left: 20px; top: 14px; width: 110px; height: 64px; border-radius: 10px; background: #0e191c; border: 2px solid var(--line); }
.note { position: absolute; font-family: Consolas, monospace; font-size: 20px; letter-spacing: .1em; color: var(--dim); }
#hud { position: absolute; inset: 0; }
#bar { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--cyan); }
</style>
</head>
<body>
<div id="stage">
  <div id="glow1"></div><div id="glow2"></div><div id="gridbg"></div>
  <div id="scenes"></div>
  <div id="rings" style="position:absolute;inset:0"></div>
  <div id="fx" style="position:absolute;inset:0;overflow:hidden;pointer-events:none"></div>
  <div id="hud">
    <img id="hudlogo" src="../src/assets/official/dunfaire-d-icon-dark.svg" class="abs" style="left:96px;top:56px;height:52px">
    <div class="lab" id="hudtag" style="right:96px;top:68px;font-size:20px;color:var(--dim)">DUNFAIRE · GUARDIAN</div>
    <div id="bar"></div>
  </div>
</div>
<script>
const FPS = 30, TOTAL = 95;
const $ = (s, r = document) => r.querySelector(s);
const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);

const scenes = [];
function scene(a, b, html, fn) {
  const d = document.createElement("div"); d.className = "sc"; d.innerHTML = html; $("#scenes").appendChild(d);
  const s = { a, b, d, fn, data: [...d.querySelectorAll("[data-a]")].map(e => ({ e, v: e.dataset.a.split(" ").map(Number) })) };
  scenes.push(s); return s;
}
const tools = ["Network monitor", "Backup tool", "Patch list", "Firewall logs", "Ticket inbox"];
const tcol = ["#F2B34C", "#F26B73", "#8B5CF6", "#F2B34C", "#F26B73"];
const areas = ["Network", "Firewalls", "Clients", "Servers", "Backup", "Security", "Incidents"];
const acol = ["#55D69E", "#55D69E", "#55D69E", "#F2B34C", "#55D69E", "#F26B73", "#F2B34C"];
const atxt = ["OK", "OK", "OK", "CHECK", "OK", "ACT", "CHECK"];
function windows() { // five tool windows across the full width, each with its own alert count
  return tools.map((t, i) => `<div class="card" data-a="${.6 + i * .35} .6 0 ${i % 2 ? -70 : 70}" data-m="${3.5 + i * .3} 4 0 ${i % 2 ? 30 : -30} 1.03" style="left:${100 + i * 350}px;top:${600 + (i % 2) * 40}px;width:320px;height:220px">
    <div class="abs" style="left:24px;top:24px;font-size:30px;font-weight:600">${t}</div>
    <div class="abs ct" data-n="${[14, 3, 27, 9, 41][i]}" style="left:24px;top:92px;min-width:84px;text-align:center;padding:6px 16px;border-radius:24px;font-size:34px;font-weight:700;background:rgba(242,107,115,.18);color:${tcol[i]}">0</div>
    <div class="abs" style="left:24px;top:160px;font-size:24px;color:var(--dim)">its own alerts</div></div>`).join("");
}

/* ---------- 1: Monday morning (0-9 s): clock left, headline right, five tools across the bottom ---------- */
scene(0, 9, `
  <div class="lab" data-a=".3 .7 0 20" style="left:100px;top:170px">THE I.T. OFFICE</div>
  <div class="clock" data-a=".5 .9 0 30" style="left:100px;top:215px;font-size:190px;color:var(--cyan)">08:40</div>
  <div class="h1" data-a="1.2 .9 0 40" style="left:900px;top:235px;width:920px;font-size:84px">Five tools.<br>Five streams of alerts.</div>
  <div class="note" data-a="2.4 .6 0 0" style="left:900px;top:470px;font-size:24px">MONDAY · ONE TIRED I.T. MANAGER</div>
  ${windows()}
`, lt => { document.querySelectorAll(".sc")[0].querySelectorAll(".ct").forEach(e => e.textContent = Math.round(+e.dataset.n * clamp((lt - 1.5) / 5))); });

/* ---------- 2: finance calls (9-20 s): centred stack ---------- */
scene(9, 20, `
  <div class="lab" data-a=".3 .7 0 20" style="left:0;width:1920px;text-align:center;top:170px">09:00 A.M.</div>
  <div class="h1" data-a=".5 .9 0 40" style="left:0;width:1920px;top:215px;text-align:center;font-size:88px">Finance calls.<br>The invoices will not load.</div>
  <div class="card" data-a=".9 .9 0 -90" data-m="3 6 0 22 1.03" style="left:260px;top:450px;width:1400px;height:220px;border-color:var(--red)">
    <div class="abs" style="left:40px;top:24px;font-size:28px;font-weight:700;color:var(--red)">INCOMING CALL · FINANCE</div>
    <div class="abs" style="left:40px;top:74px;font-size:50px;font-weight:600">“The invoices will not open.”</div>
    <div class="abs" style="left:40px;top:152px;font-size:28px;color:var(--dim)">Month end is Friday.</div>
    <div class="abs" id="q1" style="left:1240px;top:20px;font-size:170px;font-weight:700;color:var(--dim)">?</div></div>
  <div class="chip" data-a="3.2 .6 -200 0" data-m="6 4 -30 0 1.04" style="left:260px;top:720px;width:420px;height:90px;line-height:86px;font-size:36px;border-radius:45px;text-align:center">Which server?</div>
  <div class="chip" data-a="4.2 .6 0 120" data-m="6 4 0 20 1.04" style="left:750px;top:720px;width:420px;height:90px;line-height:86px;font-size:36px;border-radius:45px;text-align:center">Since when?</div>
  <div class="chip" data-a="5.2 .6 200 0" data-m="6 4 30 0 1.04" style="left:1240px;top:720px;width:420px;height:90px;line-height:86px;font-size:36px;border-radius:45px;text-align:center">Who owns it?</div>
  <div class="sub" data-a="3.4 .9 0 30" style="left:310px;width:1300px;top:850px;text-align:center;font-size:34px">A full disk, a failed backup, a missed patch. Which one is it? Nobody can point at it.</div>
  <div class="note" data-a="3 .6 0 0" style="left:0;width:1920px;text-align:center;top:960px;color:var(--red)">NOTHING TO POINT AT</div>
`, lt => { $("#q1").style.color = `rgba(143,163,167,${.5 + .5 * Math.sin(lt * 4) ** 2})`; });

/* ---------- 3: the question (20-30 s) ---------- */
scene(20, 30, `
  <div class="h1" data-a=".3 1 0 40" data-m="1 9 0 0 1.07" style="left:0;width:1920px;top:300px;text-align:center;font-size:124px">Have you ever run into<br>this problem?</div>
  <div class="sub" data-a="4.4 .9 0 30" data-m="5.3 4 0 0 1.1" style="left:0;width:1920px;top:660px;text-align:center;font-size:72px;color:var(--cyan);font-weight:700">The solution is with us.</div>
`, () => {});

/* ---------- 4: the answer (30-41 s): title on top, three boxes across the full width ---------- */
scene(30, 41, `
  <img data-a="0.2 1 0 30" class="abs" src="../src/assets/official/dunfaire-d-icon-dark.svg" style="left:900px;top:150px;height:120px">
  <div class="h1" data-a=".5 .9 0 40" style="left:0;width:1920px;top:285px;text-align:center;font-size:124px">Dunfaire Guardian</div>
  <div class="sub" data-a="1.4 .9 0 30" style="left:360px;width:1200px;top:440px;text-align:center;font-size:36px">One console, on your premises, for every machine, device and threat.</div>
  <div class="card" data-a="1.2 .7 -180 0" data-m="5 4 40 0 1" style="left:170px;top:560px;width:460px;height:340px;background:#0e191c">
    <div class="abs" style="left:34px;top:34px;font-size:38px;font-weight:600">Estate</div>
    <div class="abs" style="left:34px;top:100px;font-size:27px;color:var(--dim);width:390px;line-height:1.5">Servers, clients, network, firewalls, backup</div></div>
  <div class="card" data-a="1.8 .7 0 90" data-m="4 2.5 0 -14 1.08" style="left:730px;top:560px;width:460px;height:340px;border-color:var(--cyan);background:rgba(0,203,248,.08)">
    <div class="abs" style="left:34px;top:34px;font-size:38px;font-weight:600;color:var(--cyan)">Guardian</div>
    <div class="abs" style="left:34px;top:100px;font-size:27px;color:var(--dim);width:390px;line-height:1.5">One health score, one list of what matters</div></div>
  <div class="card" data-a="2.4 .7 180 0" data-m="5 4 -40 0 1" style="left:1290px;top:560px;width:460px;height:340px;background:#0e191c">
    <div class="abs" style="left:34px;top:34px;font-size:38px;font-weight:600">You</div>
    <div class="abs" style="left:34px;top:100px;font-size:27px;color:var(--dim);width:390px;line-height:1.5">One screen</div></div>
  <div class="abs" data-a="2.2 .6 0 0" style="left:648px;top:690px;font-size:60px;color:var(--cyan)">→</div>
  <div class="abs" data-a="2.8 .6 0 0" style="left:1208px;top:690px;font-size:60px;color:var(--cyan)">→</div>
  <div class="note" data-a="1 .6 0 0" style="left:0;width:1920px;text-align:center;top:950px">YOUR PREMISES · ONE CONSOLE</div>
`, () => {});

/* ---------- 5: Mission Control (41-54 s): box on the left, text on the right ---------- */
scene(41, 54, `
  <div class="card" data-a=".6 .9 -140 0" data-m="3 8 25 0 1.02" style="left:100px;top:170px;width:1000px;height:790px">
    <div class="abs" style="left:44px;top:34px;font-size:24px;font-family:Consolas,monospace;letter-spacing:.1em;color:var(--dim)">HEALTH SCORE</div>
    <div class="clock" id="score" style="left:44px;top:72px;font-size:150px;color:var(--cyan)">0</div>
    ${areas.map((n, i) => `<div class="row" data-a="${1.4 + i * .3} .6 ${i % 2 ? 90 : -90} 0" style="left:${44 + (i % 2) * 470}px;top:${300 + Math.floor(i / 2) * 110}px;width:440px;height:84px"><b style="left:26px;top:20px;font-size:32px">${n}</b><em style="top:22px;background:${acol[i]}22;color:${acol[i]}">${atxt[i]}</em></div>`).join("")}
    <div class="note" data-a="3.6 .6 0 0" style="left:44px;top:735px">SAMPLE DATA, FOR ILLUSTRATION</div></div>
  <div class="lab" data-a=".3 .7 0 20" style="left:1200px;top:300px">MISSION CONTROL</div>
  <div class="h1" data-a=".5 .9 0 40" style="left:1200px;top:355px;width:640px;font-size:88px">One score.<br>Seven areas.</div>
  <div class="sub" data-a="1.3 .9 0 30" style="left:1200px;top:600px;width:600px;font-size:34px">From network to incidents, with the next steps for today.</div>
  <div class="chip" data-a="3.4 .6 0 40" data-m="7 5 0 -14 1.05" style="left:1200px;top:790px;font-size:30px;height:62px;line-height:58px">Next steps</div>
  <div class="chip" data-a="3.8 .6 0 40" data-m="7 5 0 14 1.05" style="left:1420px;top:790px;font-size:30px;height:62px;line-height:58px">Today’s actions</div>
  <div class="chip" data-a="4.2 .6 0 40" data-m="7 5 0 -14 1.05" style="left:1200px;top:880px;font-size:30px;height:62px;line-height:58px">Shift handover</div>
`, lt => { $("#score").textContent = Math.round(82 * clamp((lt - 1) / 3)); });

/* ---------- 6: Alerts (54-66 s): title across the top, three full-width rows ---------- */
scene(54, 66, `
  <div class="lab" data-a=".3 .7 0 20" style="left:100px;top:165px">ALERTS · RANKED</div>
  <div class="h1" data-a=".5 .9 0 40" style="left:100px;top:210px;width:1200px;font-size:84px">The right one comes first.</div>
  <div class="sub" data-a="1.3 .9 0 30" style="left:1260px;top:200px;width:560px;font-size:30px">Every open alert in one list. Filter, assign, and watch the S.L.A. clock.</div>
  <div class="row" id="a0" data-a=".8 .6 -160 0" data-m="3 6 30 0 1" style="left:100px;top:395px;width:1720px;height:120px;border-color:var(--red)"><u style="left:24px;top:22px;width:130px;height:74px"></u><b style="left:190px;top:18px;font-size:42px">Server FIN-02 · disk 98% full</b><span style="left:190px;top:74px;font-size:26px">Invoice store · S.L.A. 00:42 left</span><em style="top:36px;right:32px;font-size:28px;background:rgba(242,107,115,.18);color:var(--red)">CRITICAL</em></div>
  <div class="row" data-a="1.1 .6 160 0" data-m="3.5 6 -30 0 1" style="left:100px;top:540px;width:1720px;height:120px"><u style="left:24px;top:22px;width:130px;height:74px"></u><b style="left:190px;top:18px;font-size:42px">Backup job · failed 3 nights</b><span style="left:190px;top:74px;font-size:26px">Finance share</span><em style="top:36px;right:32px;font-size:28px;background:rgba(242,179,76,.18);color:var(--amber)">HIGH</em></div>
  <div class="row" data-a="1.4 .6 -160 0" data-m="4 6 30 0 1" style="left:100px;top:685px;width:1720px;height:120px"><u style="left:24px;top:22px;width:130px;height:74px"></u><b style="left:190px;top:18px;font-size:42px">Patch pending · 12 clients</b><span style="left:190px;top:74px;font-size:26px">Scheduled</span><em style="top:36px;right:32px;font-size:28px;background:rgba(143,163,167,.18);color:var(--dim)">MEDIUM</em></div>
  <div class="chip" data-a="3.6 .6 -120 0" style="left:100px;top:855px;width:320px;height:72px;line-height:68px;font-size:32px;text-align:center;background:var(--cyan);color:#06222a;border-color:var(--cyan)">Assign to me</div>
  <div class="chip" data-a="3.9 .6 -120 0" style="left:450px;top:855px;width:300px;height:72px;line-height:68px;font-size:32px;text-align:center">Acknowledge</div>
  <div class="chip" data-a="3 .6 0 60" data-m="7 4 0 -12 1.04" style="left:1040px;top:855px;height:72px;line-height:68px;font-size:30px">My queue</div>
  <div class="chip" data-a="3.4 .6 0 60" data-m="7 4 0 12 1.04" style="left:1240px;top:855px;height:72px;line-height:68px;font-size:30px">Unassigned</div>
  <div class="chip" data-a="3.8 .6 0 60" data-m="7 4 0 -12 1.04" style="left:1470px;top:855px;height:72px;line-height:68px;font-size:30px">Overdue</div>
  <div class="note" data-a="4.4 .6 0 0" style="left:100px;top:965px">SAMPLE ALERTS, FOR ILLUSTRATION</div>
`, lt => { const on = clamp((lt - 2.4) / .8); $("#a0").style.background = `rgba(242,107,115,${.06 + .08 * on})`; });

/* ---------- 7: Protection and backup (66-76 s): title centred, two boxes side by side ---------- */
scene(66, 76, `
  <div class="lab" data-a=".3 .7 0 20" style="left:0;width:1920px;text-align:center;top:165px">PROTECTION · BACKUP</div>
  <div class="h1" data-a=".5 .9 0 40" style="left:0;width:1920px;top:210px;text-align:center;font-size:92px">Danger first. Safety shown.</div>
  <div class="card" data-a=".9 .8 -120 60" data-m="2.5 6 -18 -14 1.03" style="left:100px;top:390px;width:840px;height:480px">
    <div class="note" style="left:36px;top:30px">PROTECTION · VULNERABILITIES</div>
    <div class="row" data-a="1.4 .6 -80 0" style="left:36px;top:92px;width:768px;height:130px;border-color:var(--red)"><b style="left:28px;top:22px;font-size:38px">Actively exploited</b><span style="left:28px;top:78px;font-size:24px">Sorted to the top of the list</span><em style="top:42px;background:rgba(242,107,115,.18);color:var(--red)">FIRST</em></div>
    <div class="row" data-a="1.8 .6 80 0" style="left:36px;top:250px;width:768px;height:130px"><b style="left:28px;top:22px;font-size:38px">Scan coverage and history</b><span style="left:28px;top:78px;font-size:24px">Know what was checked, and when</span></div></div>
  <div class="card" data-a="1.3 .8 120 60" data-m="3 6 18 14 1.03" style="left:980px;top:390px;width:840px;height:480px">
    <div class="note" style="left:36px;top:30px">BACKUP · MISSION CONTROL AREA</div>
    <div class="abs" data-a="2.6 .6 0 20" style="left:36px;top:110px;width:768px;height:28px;border-radius:14px;background:var(--line)"><div id="bk" class="abs" style="left:0;top:0;height:28px;border-radius:14px;background:var(--green)"></div></div>
    <div class="abs" data-a="3 .7 0 20" style="left:36px;top:200px;font-size:110px;font-weight:700;color:var(--green)">Healthy</div>
    <div class="abs" data-a="3.4 .6 0 0" style="left:36px;top:350px;font-size:34px;color:var(--dim)">and you see it at a glance</div></div>
  <div class="sub" data-a="4 .9 0 30" style="left:260px;width:1400px;top:915px;text-align:center;font-size:30px">Actively exploited vulnerabilities rise to the top. Backup health is one click away.</div>
`, lt => { $("#bk").style.width = (768 * clamp((lt - 2.6) / 3)) + "px"; });

/* ---------- 8: same Monday, new story (76-85 s): title centred, three step boxes, full-width timeline ---------- */
scene(76, 85, `
  <div class="lab" data-a=".3 .7 0 20" style="left:0;width:1920px;text-align:center;top:165px">SAME MONDAY. NEW STORY.</div>
  <div class="h1" data-a=".5 .9 0 40" style="left:0;width:1920px;top:210px;text-align:center;font-size:88px">The invoices load. Finance never calls.</div>
  <div class="card" data-a="1 .7 0 120" data-m="4.5 4 0 -14 1.03" style="left:100px;top:400px;width:540px;height:320px"><div class="clock" style="left:40px;top:34px;font-size:92px;color:var(--red)">08:41</div><div class="abs" style="left:40px;top:160px;font-size:44px;font-weight:600">One alert</div><div class="abs" style="left:40px;top:228px;font-size:30px;color:var(--dim)">Disk almost full</div></div>
  <div class="card" data-a="2.2 .7 0 120" data-m="5 4 0 14 1.03" style="left:690px;top:400px;width:540px;height:320px"><div class="clock" style="left:40px;top:34px;font-size:92px;color:var(--amber)">08:44</div><div class="abs" style="left:40px;top:160px;font-size:44px;font-weight:600">One owner</div><div class="abs" style="left:40px;top:228px;font-size:30px;color:var(--dim)">Assigned in a click</div></div>
  <div class="card" data-a="3.4 .7 0 120" data-m="5.5 4 0 -14 1.03" style="left:1280px;top:400px;width:540px;height:320px"><div class="clock" style="left:40px;top:34px;font-size:92px;color:var(--green)">08:55</div><div class="abs" style="left:40px;top:160px;font-size:44px;font-weight:600">One fix</div><div class="abs" style="left:40px;top:228px;font-size:30px;color:var(--dim)">Before nine o’clock</div></div>
  <div class="abs" style="left:100px;top:830px;width:1720px;height:10px;border-radius:5px;background:var(--line)"><div id="tl" class="abs" style="left:0;top:0;height:10px;border-radius:5px;background:var(--cyan)"></div></div>
  <div class="abs" data-a="1 .5 0 0" style="left:350px;top:820px;width:30px;height:30px;border-radius:50%;background:var(--red)"></div>
  <div class="abs" data-a="2.2 .5 0 0" style="left:940px;top:820px;width:30px;height:30px;border-radius:50%;background:var(--amber)"></div>
  <div class="abs" data-a="3.4 .5 0 0" style="left:1530px;top:820px;width:30px;height:30px;border-radius:50%;background:var(--green)"></div>
  <div class="note" data-a="5 .6 0 0" style="left:0;width:1920px;text-align:center;top:930px">ILLUSTRATIVE STORY, NOT A MEASURED RESULT</div>
`, lt => { $("#tl").style.width = (1720 * clamp((lt - 1) / 4.5)) + "px"; });

/* ---------- 9: outro (85-95 s) ---------- */
scene(85, 95, `
  <img data-a="0.3 1.2 0 30" class="abs" src="../src/assets/official/dunfaire-d-icon-dark.svg" style="left:850px;top:120px;height:220px">
  <div class="h1" data-a="1.0 1 0 40" data-m="2 8 0 0 1.05" style="left:0;width:1920px;top:370px;text-align:center;font-size:140px">Dunfaire Guardian</div>
  <div class="sub" data-a="1.8 1 0 30" style="left:260px;width:1400px;top:565px;text-align:center;font-size:52px;color:var(--cyan)">See everything. Fix the right thing first.</div>
  <div class="abs" data-a="3.2 .9 0 24" data-m="4.5 5 0 0 1.06" style="left:600px;top:730px;width:720px;height:100px;border-radius:50px;background:var(--cyan);color:#06222a;font-size:42px;font-weight:700;text-align:center;line-height:100px">Book a guided demo →</div>
  <div class="abs" data-a="4 .9 0 0" style="left:0;width:1920px;top:880px;text-align:center;font-size:36px;font-family:Consolas,monospace">dunfaire.com</div>
`, () => {});

/* ---------- motion layer: transitions, kinetic text, per-element entrances, light sweeps ---------- */
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const TR = 0.5; // scene overlap, seconds
const KINDS = [0, 1, 2, 3, 4, 5, 6, 7]; // one transition kind per boundary
function trIn(k, p) {
  const o = { tf: "", clip: "none", fl: "none", op: 1 };
  if (k === 0) { o.tf = `translateX(${(1 - p) * 420}px)`; o.op = p; }
  else if (k === 1) { o.tf = `scale(${.8 + .2 * p})`; o.fl = `blur(${(1 - p) * 14}px)`; o.op = p; }
  else if (k === 2) { o.clip = `inset(0 ${(1 - p) * 100}% 0 0)`; }
  else if (k === 3) { o.tf = `translateY(${(1 - p) * 260}px)`; o.op = p; }
  else if (k === 4) { o.tf = `scale(${1.25 - .25 * p})`; o.fl = `blur(${(1 - p) * 10}px)`; o.op = p; }
  else if (k === 5) { const x = p * 130; o.clip = `polygon(0 0,${x}% 0,${x - 30}% 100%,0 100%)`; }
  else if (k === 6) { o.tf = `rotate(${(1 - p) * 4}deg) scale(${.9 + .1 * p})`; o.op = p; }
  else { o.tf = `translateX(${-(1 - p) * 420}px)`; o.op = p; }
  return o;
}
function trOut(k, q) {
  const o = { tf: "", clip: "none", fl: "none", op: 1 - q };
  if (k === 0) o.tf = `translateX(${-q * 420}px)`;
  else if (k === 1) { o.tf = `scale(${1 + .25 * q})`; o.fl = `blur(${q * 14}px)`; }
  else if (k === 2 || k === 5) o.op = 1;
  else if (k === 3) o.tf = `translateY(${-q * 260}px)`;
  else if (k === 4) o.tf = `scale(${1 - .15 * q})`;
  else if (k === 6) o.tf = `rotate(${-q * 4}deg) scale(${1 - .1 * q})`;
  else o.tf = `translateX(${q * 420}px)`;
  return o;
}
// kinetic headline: every word flies in on its own
document.querySelectorAll(".h1").forEach(h => {
  h.innerHTML = h.innerHTML.split(/<br\s*\/?>/).map(l => l.split(" ").filter(Boolean).map(w => `<span class="w" style="display:inline-block;white-space:pre">${w} </span>`).join("")).join("<br>");
});
// floating particles behind the scenes
const dots = [];
for (let i = 0; i < 40; i++) {
  const d = document.createElement("div"); const r = (i * 7919 % 100) / 100, r2 = (i * 104729 % 100) / 100;
  d.style.cssText = `position:absolute;border-radius:50%;background:#00CBF8;width:${3 + r * 5}px;height:${3 + r * 5}px`;
  $("#stage").insertBefore(d, $("#scenes")); dots.push({ d, x: r2 * 1920, sp: .012 + r * .03, off: r2, a: .12 + r * .25 });
}
// light sweeps: one diagonal band across the frame at every scene boundary
const sweeps = [];
const bounds = scenes.slice(0, -1).map(s => s.b);
bounds.forEach(() => { const e = document.createElement("div"); e.style.cssText = "position:absolute;top:-200px;height:1500px;width:420px;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(0,203,248,.28),rgba(255,255,255,.32),rgba(0,203,248,.28),transparent);pointer-events:none;display:none"; $("#fx").appendChild(e); sweeps.push(e); });
let phc = 0;
const prog = (lt, v) => (lt - v[0]) / v[1];
function enter(e, v, lt, n) {
  const c = e.className, p = ease(prog(lt, v)), op = e.classList.contains("h1") ? 1 : p;
  let tf = "", clip = "none";
  const dx = (1 - p) * v[2], dy = (1 - p) * v[3];
  if (e.classList.contains("card")) { tf = `translate(${dx}px,${dy}px) scale(${.92 + .08 * p})`; clip = `inset(0 ${(1 - sm(prog(lt, v))) * 100}% 0 0 round 22px)`; }
  else if (e.classList.contains("chip")) { const b = back(prog(lt, v)); tf = `scale(${.4 + .6 * b}) translateY(${(1 - p) * 20}px)`; }
  else if (e.classList.contains("row")) { const d = v[2] || 90, k = (1 - sm(prog(lt, v))) * 100; tf = `translateX(${(1 - p) * d}px)`; clip = d > 0 ? `inset(0 0 0 ${k}% round 16px)` : `inset(0 ${k}% 0 0 round 16px)`; }
  else if (e.classList.contains("lab")) { e.style.letterSpacing = `${.22 + (1 - p) * .5}em`; tf = `translate(${dx}px,${dy}px)`; }
  else if (e.classList.contains("clock")) { tf = `scale(${.6 + .4 * back(prog(lt, v))})`; }
  else if (e.classList.contains("note")) { clip = `inset(0 ${(1 - sm(prog(lt, v))) * 100}% 0 0)`; }
  else if (e.tagName === "IMG") { tf = `rotate(${(1 - p) * -25}deg) scale(${.5 + .5 * back(prog(lt, v))})`; }
  else tf = `translate(${dx}px,${dy}px)`;
  if (e.classList.contains("card") || e.classList.contains("row") || e.classList.contains("chip") || e.tagName === "IMG") { // idle drift, every box keeps moving
    const ph = e._ph ?? (e._ph = (phc++) * 1.7); tf += ` translate(${7 * Math.sin(lt * .8 + ph) * p}px,${9 * Math.sin(lt * 1.1 + ph * 2) * p}px) scale(${1 + .012 * Math.sin(lt * .9 + ph) * p})`;
  }
  if (e.dataset.m) { const m = e.dataset.m.split(" ").map(Number), k = sm((lt - m[0]) / m[1]); tf += ` translate(${m[2] * k}px,${m[3] * k}px) scale(${1 + (m[4] - 1) * k})`; }
  e.style.opacity = op; e.style.transform = tf; e.style.clipPath = clip;
  if (e.classList.contains("h1")) e.querySelectorAll(".w").forEach((w, i) => {
    const q = ease((lt - v[0] - i * .11) / .55);
    w.style.opacity = q; w.style.transform = `translateY(${(1 - q) * 60}px) rotate(${(1 - q) * 7}deg) scale(${.85 + .15 * q})`; w.style.filter = q < 1 ? `blur(${(1 - q) * 8}px)` : "none";
  });
}
window.render = function (t) {
  $("#glow1").style.cssText += `;left:${300 + 500 * Math.sin(t / 9)}px;top:${-100 + 200 * Math.cos(t / 7)}px`;
  $("#glow2").style.cssText += `;left:${1000 + 400 * Math.cos(t / 8)}px;top:${400 + 250 * Math.sin(t / 6)}px`;
  dots.forEach(o => { const y = 1080 - (((t * o.sp + o.off) % 1) * 1200 - 60); o.d.style.left = (o.x + 30 * Math.sin(t * .6 + o.off * 9)) + "px"; o.d.style.top = y + "px"; o.d.style.opacity = o.a; });
  scenes.forEach((s, n) => {
    const hT = TR / 2;
    const pin = n === 0 ? 1 : sm((t - (s.a - hT)) / TR), q = n === scenes.length - 1 ? 0 : sm((t - (s.b - hT)) / TR);
    const vis = t >= s.a - hT - .01 && t <= s.b + hT + .01;
    s.d.style.display = vis ? "block" : "none";
    if (!vis) return;
    const i = n === 0 ? { tf: "", clip: "none", fl: "none", op: 1 } : trIn(KINDS[(n - 1) % 8], pin);
    const o = trOut(KINDS[n % 8], q);
    const lt = t - s.a, kb = 1 + .025 * clamp(lt / (s.b - s.a)); // slow push-in
    s.d.style.opacity = Math.min(i.op, q > 0 ? o.op : 1);
    s.d.style.transform = `${i.tf} ${q > 0 ? o.tf : ""} scale(${kb})`;
    s.d.style.clipPath = i.clip;
    s.d.style.filter = q > 0 && o.fl !== "none" ? o.fl : i.fl;
    s.data.forEach(({ e, v }) => enter(e, v, lt, n));
    if (s.fn) s.fn(lt);
  });
  sweeps.forEach((e, i) => { const x = (t - (bounds[i] - .45)) / .9; e.style.display = x > 0 && x < 1 ? "block" : "none"; e.style.left = (-500 + x * 3000) + "px"; });
  // pulse rings behind the Guardian reveal and the outro logo
  const rg = $("#rings"); rg.innerHTML = "";
  [[30.5, 960, 210], [85.3, 960, 230]].forEach(([t0, cx, cy]) => { for (let k = 0; k < 3; k++) { const x = (t - t0 - k * .45) / 2; if (x > 0 && x < 1) rg.innerHTML += `<div style="position:absolute;left:${cx - 400 * ease(x)}px;top:${cy - 400 * ease(x)}px;width:${800 * ease(x)}px;height:${800 * ease(x)}px;border-radius:50%;border:3px solid rgba(0,203,248,${.5 * (1 - x)})"></div>`; } });
  $("#bar").style.width = (t / TOTAL * 1920) + "px";
  const hud = t > 0.5 && t < 85 && !(t > 20 && t < 30) ? 1 : 0; $("#hudlogo").style.opacity = hud; $("#hudtag").style.opacity = hud * 0.8;
};
window.TOTAL = TOTAL; window.FPS = FPS;
render(0);
</script>
</body>
</html>
